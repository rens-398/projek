<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Caption Generator UMKM</title>
    <style>
        /* CSS Styling Disini */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 600px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1 { color: #38bdf8; text-align: center; font-size: 24px; }
        textarea { width: 100%; height: 100px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 8px; padding: 10px; margin-top: 10px; resize: none; }
        button { background: #6366f1; color: white; border: none; padding: 12px 20px; width: 100%; border-radius: 8px; margin-top: 15px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #4f46e5; }
        .result-box { background: #0f172a; border: 1px dashed #64748b; padding: 15px; border-radius: 8px; margin-top: 20px; min-height: 50px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI Caption Generator UMKM</h1>
        <p>Bantu produk jualanmu laku keras dengan sekali klik!</p>
        
        <label for="productName">Nama Produk & Keunggulan:</label>
        <textarea id="productName" placeholder="Contoh: Kripik singkong pedas manis daun jeruk, renyah banget..."></textarea>
        
        <button onclick="generateAI()">Buat Caption Jualan 🚀</button>
        
        <div class="result-box" id="aiResult">
            <em>Hasil teks AI akan muncul di sini...</em>
        </div>
    </div>

    <script>
        // Logika JavaScript sederhana untuk simulasi AI
        function generateAI() {
            const input = document.getElementById('productName').value;
            const resultBox = document.getElementById('aiResult');
            
            if (input.trim() === "") {
                resultBox.innerHTML = "<span style='color: #f87171;'>Mohon masukkan nama produk terlebih dahulu!</span>";
                return;
            }

            resultBox.innerHTML = "Sedang memproses AI...";
            
            setTimeout(() => {
                const templates = [
                    `🔥 PROMO SPESIAL HARI INI! Dapatkan ${input} sekarang juga. Rasanya dijamin bikin ketagihan dan ngga bisa berhenti mengunyah! Yuk, amankan pesananmu sebelum kehabisan! 🛒✨ #JajananEnak #PromoUmkm`,
                    `✨ Lagi cari cemilan pas santai? Coba ${input}! Kualitas juara, harga ramah di kantong, bikin harimu makin seru. Pesan sekarang via DM! 📲 #KulinerNusantara #RekomendasiProduk`,
                    `🌟 Best Seller Alert! ${input} siap menemani aktivitasmu. Dijamin nagih sejak gigitan pertama. Stok terbatas, yuk order sekarang! 🚀 #ProdukLokal #BelanjaAman`
                ];
                const randomCaption = templates[Math.floor(Math.random() * templates.length)];
                resultBox.innerHTML = `<strong>Hasil AI:</strong><br><br>${randomCaption}`;
            }, 1000);
        }
    </script>
</body>
</html>
